<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="My link-in-bio — everything in one place.">
<title>Ace ✦ links</title>

<!-- Tiny inline favicon (pink→purple gradient dot) — no external files needed -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff5fd2'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='14' fill='url(%23g)'/%3E%3C/svg%3E">

<!-- ============================================================
     FONTS  (the only external dependency — swap or delete freely)
     Space Grotesk  → display name / button labels (has character)
     Outfit         → bio & small text (clean, readable)
     ============================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

<style>
  /* ============================================================
     DESIGN TOKENS — the whole color system lives here.
     Tweak these to re-theme the page.
     ============================================================ */
  :root {
    --pink:          #ff5fd2;
    --pink-soft:     #ff9ee6;
    --purple:        #8b5cf6;
    --purple-soft:   #b79bff;

    --ink:           #ffffff;                 /* main text          */
    --muted:         rgba(255, 255, 255, 0.72); /* secondary text     */

    --link-bg:       linear-gradient(135deg, rgba(255,95,210,.16), rgba(139,92,246,.16));
    --link-border:   rgba(255, 255, 255, 0.16);
    --link-glow:     0 0 22px rgba(255, 95, 210, 0.35), 0 8px 32px rgba(139, 92, 246, 0.35);

    --radius:        999px;                   /* pill radius        */
    --font-display:  "Space Grotesk", sans-serif;
    --font-body:     "Outfit", sans-serif;
  }

  /* ---------- base reset ---------- */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: var(--font-body);
    color: var(--ink);
    background: #160b26;                 /* fallback while video loads */
    overflow-x: hidden;
  }

  /* ============================================================
     VIDEO BACKGROUND
     Swap the <source> URL in the HTML below for your own clip
     (MP4 / WebM). The gradient overlay keeps text readable.
     ============================================================ */
  .bg-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: blur(2px) brightness(0.55) saturate(1.2);
    transform: scale(1.06);              /* hides blurred edges */
    z-index: -2;
  }

  /* pink→purple wash + dark vignette on top of the video */
  .bg-overlay {
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(120% 90% at 50% 10%, rgba(139, 92, 246, 0.28), transparent 60%),
      linear-gradient(165deg, rgba(255, 95, 210, 0.30), rgba(139, 92, 246, 0.38) 60%, rgba(22, 11, 38, 0.75));
  }

  /* ============================================================
     LAYOUT — centered profile column
     ============================================================ */
  .page {
    min-height: 100vh;
    min-height: 100dvh;                  /* mobile URL-bar friendly */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 72px 20px 40px;             /* room for corner buttons */
    text-align: center;
  }

  /* ---------- avatar (circular, gradient ring, status dot) ---------- */
  .avatar-wrap {
    position: relative;
    width: 116px;
    height: 116px;
    padding: 4px;                        /* becomes the gradient ring */
    border-radius: 50%;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    box-shadow: 0 0 34px rgba(255, 95, 210, 0.45), 0 0 60px rgba(139, 92, 246, 0.30);
  }
  .avatar-wrap img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    background: linear-gradient(135deg, var(--pink), var(--purple)); /* fallback behind transparent imgs */
  }
  /* letter fallback shown if the avatar image fails to load */
  .avatar-fallback {
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-family: var(--font-display);
    font-size: 2.6rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, var(--pink), var(--purple));
  }

  /* Discord-style presence dot (bottom-right of avatar) */
  .status-dot {
    position: absolute;
    right: 4px;
    bottom: 4px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #3ddc84;
    border: 4px solid #1d0f33;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(61, 220, 132, 0.55); }
    50%      { box-shadow: 0 0 0 8px rgba(61, 220, 132, 0); }
  }
  /* pulse only while the live status is actually "online" */
  .status-dot.live-online { animation: pulse 2.4s ease-in-out infinite; }

  /* ---------- name ---------- */
  .name {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(1.7rem, 5.5vw, 2.15rem);
    letter-spacing: 0.5px;
    background: linear-gradient(90deg, var(--pink-soft), #ffffff 45%, var(--purple-soft));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 12px rgba(139, 92, 246, 0.35));
  }

  /* ---------- Discord-style "presence" badge (static) ----------
     Just a styled pill — swap the text in the CONFIG below.      */
  .presence {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: var(--radius);
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--muted);
    background: rgba(28, 14, 48, 0.55);
    border: 1px solid var(--link-border);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .presence .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #3ddc84;
    flex-shrink: 0;
  }
  /* ---------- live custom status text line (synced from Discord) ---------- */
  .status-line {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 10px;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 0.92rem;
    font-weight: 500;
    color: var(--muted);
    background: rgba(28, 14, 48, 0.45);
    border: 1px solid var(--link-border);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .status-line[hidden] { display: none; }
  .status-line img.emoji { width: 18px; height: 18px; object-fit: contain; }
  /* ---------- live activity panel (games / Spotify / custom status) ---------- */
  .activities {
    list-style: none;
    width: 100%;
    max-width: 400px;                /* matches the link buttons */
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 2px;
  }
  .activities[hidden] { display: none; }   /* keep flex from overriding hidden */
  .activities li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-radius: 16px;
    background: rgba(28, 14, 48, 0.55);
    border: 1px solid var(--link-border);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    text-align: left;
    animation: rise 0.5s ease both;
  }
  .act-icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, rgba(255, 95, 210, 0.25), rgba(139, 92, 246, 0.25));
  }
  .act-icon svg { width: 18px; height: 18px; color: var(--pink-soft); }
  .act-art-wrap {
    position: relative;
    flex-shrink: 0;
    line-height: 0;
  }
  .act-art {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    flex-shrink: 0;
    object-fit: cover;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
  }
  /* small status badge overlaid on the artwork, like Discord */
  .act-art-small {
    position: absolute;
    right: -3px;
    bottom: -3px;
    width: 17px;
    height: 17px;
    border-radius: 50%;
    border: 2px solid #1d0f33;
    background: #1d0f33;
    object-fit: cover;
  }
  .act-body {
    display: flex;
    flex-direction: column;
    line-height: 1.3;
    min-width: 0;
  }
  .act-name {
    font-weight: 600;
    font-size: 0.88rem;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .act-detail {
    font-size: 0.78rem;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .act-time {
    margin-left: auto;
    flex-shrink: 0;
    font-size: 0.75rem;
    color: rgba(255, 255, 255, 0.45);
  }

  /* ---------- bio / tagline ---------- */
  .bio {
    max-width: 34ch;
    font-size: 0.98rem;
    line-height: 1.55;
    color: var(--muted);
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.45);
  }

  /* ============================================================
     LINK BUTTONS — rendered from the CONFIG array below.
     Hover: lift + scale + glow + arrow slide.
     ============================================================ */
  .links {
    list-style: none;
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 6px;
  }
  .links a {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 15px 20px;                  /* ~50px tall → comfy touch target */
    min-height: 50px;
    border-radius: var(--radius);
    background: var(--link-bg);
    border: 1px solid var(--link-border);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: var(--ink);
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 1rem;
    text-decoration: none;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    transition: transform 0.25s ease, box-shadow 0.25s ease,
                border-color 0.25s ease, background 0.25s ease;
    animation: rise 0.6s ease both;      /* staggered via JS delay */
  }
  .links a:hover,
  .links a:focus-visible {
    transform: translateY(-3px) scale(1.03);
    border-color: rgba(255, 159, 230, 0.65);
    background: linear-gradient(135deg, rgba(255, 95, 210, 0.28), rgba(139, 92, 246, 0.28));
    box-shadow: var(--link-glow);
  }
  .links a:active { transform: translateY(-1px) scale(0.98); }
  .links a:focus-visible { outline: 2px solid var(--pink-soft); outline-offset: 3px; }

  .links .icon {
    width: 20px;
    height: 20px;
    color: var(--pink-soft);
    flex-shrink: 0;
    transition: color 0.25s ease, transform 0.25s ease;
  }
  .links a:hover .icon { color: #fff; transform: scale(1.12); }

  .links .label { flex: 1; text-align: left; }

  .links .arrow {
    width: 16px;
    height: 16px;
    color: var(--muted);
    opacity: 0.55;
    transform: translateX(-4px);
    transition: transform 0.25s ease, opacity 0.25s ease, color 0.25s ease;
  }
  .links a:hover .arrow { transform: translateX(2px); opacity: 1; color: var(--pink-soft); }

  /* entrance animation (disabled for reduced-motion, see below) */
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---------- footer ---------- */
  .footer {
    font-size: 0.78rem;
    color: rgba(255, 255, 255, 0.5);
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
    margin-top: 8px;
  }

  /* ============================================================
     FIXED CORNER CONTROLS — music toggle + views counter
     ============================================================ */
  .corner-btn {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 10;
    width: 46px;
    height: 46px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 1px solid var(--link-border);
    background: rgba(28, 14, 48, 0.6);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: var(--ink);
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }
  .corner-btn:hover { transform: scale(1.08); box-shadow: var(--link-glow); border-color: rgba(255,159,230,.6); }
  .corner-btn:active { transform: scale(0.95); }
  .corner-btn:focus-visible { outline: 2px solid var(--pink-soft); outline-offset: 3px; }
  .corner-btn svg { width: 20px; height: 20px; }

  .views-pill {
    position: fixed;
    bottom: 16px;
    left: 16px;
    z-index: 10;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    border-radius: var(--radius);
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--muted);
    background: rgba(28, 14, 48, 0.6);
    border: 1px solid var(--link-border);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
  }
  .views-pill svg { width: 16px; height: 16px; color: var(--pink-soft); }
  .views-pill b { color: var(--ink); font-weight: 600; }
  .views-sub {
    display: block;
    font-size: 0.72rem;
    color: rgba(255, 255, 255, 0.5);
    margin-top: 1px;
  }

  /* ============================================================
     RESPONSIVE — small screens: tighter padding, smaller avatar
     ============================================================ */
  @media (max-width: 480px) {
    .avatar-wrap { width: 98px; height: 98px; }
    .page { padding: 64px 16px 40px; }
    .links a { padding: 14px 16px; }
  }

  /* ============================================================
     ACCESSIBILITY — respect reduced-motion preferences
     ============================================================ */
  @media (prefers-reduced-motion: reduce) {
    .links a { animation: none; }
    .status-dot { animation: none; }
    * { transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

  <!-- ============================================================
       BACKGROUND VIDEO — replace the <source> URL with your own.
       Needs to be an MP4/WebM you're allowed to hotlink. The
       overlay gradient below keeps the text readable on any clip.
       ============================================================ -->
  <video class="bg-video" autoplay muted loop playsinline
         aria-hidden="true" disablepictureinpicture>
    <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
    <!-- e.g. <source src="my-background.mp4" type="video/mp4"> -->
  </video>
  <div class="bg-overlay" aria-hidden="true"></div>

  <!-- ============================================================
       MUSIC TOGGLE — this button starts/stops a tiny WebAudio
       synth pad (no audio file needed). Want a real song instead?
       Add: <audio id="bgm" src="song.mp3" loop></audio>
       and swap the JS in the MUSIC section accordingly.
       ============================================================ -->
  <button class="corner-btn" id="musicBtn" type="button"
          aria-label="Toggle background music" aria-pressed="false" title="Toggle music">
    <!-- speaker-muted icon (shown by default) -->
    <svg id="iconMuted" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M11 5 6 9H2v6h4l5 4V5z" fill="currentColor" stroke="none"/>
      <line x1="22" y1="9" x2="16" y2="15"/>
      <line x1="16" y1="9" x2="22" y2="15"/>
    </svg>
    <!-- speaker-on icon (shown while playing) -->
    <svg id="iconOn" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
         aria-hidden="true" style="display:none">
      <path d="M11 5 6 9H2v6h4l5 4V5z" fill="currentColor" stroke="none"/>
      <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
      <path d="M18.5 5.5a9.5 9.5 0 0 1 0 13"/>
    </svg>
  </button>

  <!-- ============================================================
       VIEWS COUNTER — guns.lol-style: shows UNIQUE visitors only
       (each real person counts once; refreshing never bumps it).
       Data comes from the Cloudflare Worker /api/views, filled by
       the JS module below.
       ============================================================ -->
  <div class="views-pill" role="status" aria-live="polite">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>
    <span>
      <b id="viewCount">0</b> views
      <span class="views-sub" id="viewUnique"></span>
    </span>
  </div>

  <!-- ============================================================
       PROFILE CARD (content is rendered from the CONFIG in JS)
       ============================================================ -->
  <main class="page">
    <div class="avatar-wrap">
      <span class="avatar-fallback" aria-hidden="true" id="avatarFallback">K</span>
      <!-- SWAP: put your own avatar image path here -->
      <img id="avatarImg" src="https://api.dicebear.com/9.x/lorelei/svg?seed=Kira"
           alt="Profile avatar" onerror="this.style.display='none'">
      <span class="status-dot" aria-hidden="true"></span>
    </div>

    <h1 class="name" id="displayName">—</h1>

    <!-- Discord presence badge — status word + dot, live via Lanyard (see JS) -->
    <span class="presence"><span class="dot"></span><span id="presenceText">—</span></span>

    <!-- live custom status line ("what's on your mind"), synced from Discord -->
    <div class="status-line" id="statusLine" hidden></div>

    <!-- live activity panel: games, Spotify, watching (filled by JS) -->
    <ul class="activities" id="activityList" hidden></ul>

    <p class="bio" id="bioText">—</p>

    <!-- link buttons get injected here by renderLinks() -->
    <ul class="links" id="linkList"></ul>

    <p class="footer" id="footerText"></p>
  </main>

<script>
/* ================================================================
   ✏️  EDIT ME — all your content lives in this one CONFIG object.
   Change text, URLs, avatar, video, views count… nothing else.
   ================================================================ */
const CONFIG = {
  name: "Ace",                                 // display name
  tagline: "hey, i'm ace — streamer, gamer & certified silly goose 🃏", // short bio
  presence: "in voice chat",                   // fallback when Lanyard has no live data
  avatar: "https://cdn.discordapp.com/avatars/735574309162188822/0601178670685cc18b0ce8a3724826dd.png?size=256", // your real Discord avatar (swap anytime)

  /* Each link: { label, url, icon } — icon picks an SVG from
     the ICONS map below. Add new icons there if you need them. */
  links: [
    { label: "Discord",   url: "https://discord.com/users/735574309162188822", icon: "discord" },
    { label: "Instagram", url: "https://www.instagram.com/spadilleace/",       icon: "instagram" },
    { label: "Twitch",    url: "https://www.twitch.tv/spadilleace",            icon: "twitch" },
  ],
};

/* ================================================================
   ICON MAP — inline SVG icons (no icon library needed).
   "key": { path | markup } rendered inside a 24×24 viewBox.
   ================================================================ */
const ICONS = {
  discord: { d: "M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.865-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.058a.082.082 0 0 0 .031.056 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.873-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .079.01c.12.099.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z" },
  instagram: { stroke: true, markup: '<rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none"/>' },
  twitch: { d: "M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0 1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z" },
  link: { stroke: true, markup: '<circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="3.5" ry="9"/><line x1="3" y1="12" x2="21" y2="12"/>' },
};

/* ================================================================
   RENDER — fill the page from CONFIG.
   ================================================================ */
document.addEventListener("DOMContentLoaded", () => {
  // --- static content ---
  document.getElementById("displayName").textContent = CONFIG.name;
  document.getElementById("bioText").textContent = CONFIG.tagline;
  document.getElementById("presenceText").textContent = CONFIG.presence;
  document.getElementById("avatarImg").src = CONFIG.avatar;
  document.getElementById("avatarFallback").textContent = CONFIG.name.trim().charAt(0).toUpperCase();
  document.getElementById("footerText").textContent = `© ${new Date().getFullYear()} ${CONFIG.name} · all rights reserved`;

  // --- link buttons ---
  const list = document.getElementById("linkList");
  CONFIG.links.forEach((link, i) => {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = link.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.style.animationDelay = `${0.15 + i * 0.07}s`;   // staggered entrance

    // icon (fill-based path or stroke-based markup)
    const icon = ICONS[link.icon] || ICONS.link;
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("class", "icon");
    svg.setAttribute("aria-hidden", "true");
    if (icon.stroke) {
      svg.setAttribute("fill", "none");
      svg.setAttribute("stroke", "currentColor");
      svg.setAttribute("stroke-width", "2");
      svg.setAttribute("stroke-linecap", "round");
      svg.setAttribute("stroke-linejoin", "round");
      svg.innerHTML = icon.markup;
    } else {
      svg.setAttribute("fill", "currentColor");
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", icon.d);
      svg.appendChild(path);
    }

    // label + arrow
    const label = document.createElement("span");
    label.className = "label";
    label.textContent = link.label;
    const arrow = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    arrow.setAttribute("viewBox", "0 0 24 24");
    arrow.setAttribute("class", "arrow");
    arrow.setAttribute("aria-hidden", "true");
    arrow.innerHTML = '<path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';

    a.append(svg, label, arrow);
    li.appendChild(a);
    list.appendChild(li);
  });

  // --- views counter: animated count-up to CONFIG.views ---
  // (removed — the REAL views counter module below replaces it)
});

/* ================================================================
   REAL VIEWS COUNTER — guns.lol-style: shows UNIQUE visitors only,
   so refreshing the page never bumps your own number. Tiers:
     1) own Cloudflare Worker /api/views  (immune to ad-blockers)
     2) Busuanzi (busuanzi.ibruce.info)   — free hit-counter, no
        account needed; returns unique visitors via JSONP
     3) local per-device count, labeled "(local)" so it's never
        mistaken for the real number.
   ================================================================ */
(function initViews() {
  const el = document.getElementById("viewCount");
  const uniqEl = document.getElementById("viewUnique");
  const LS = {                                    // localStorage guard (private mode, etc.)
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  // smooth count-up animation to the real number
  const animate = target => {
    const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduced) { el.textContent = target.toLocaleString("en-US"); return; }
    const duration = 1400, start = performance.now();
    const ease = t => 1 - Math.pow(1 - t, 3);     // ease-out cubic
    (function tick(now) {
      const p = Math.min((now - start) / duration, 1);
      el.textContent = Math.round(target * ease(p)).toLocaleString("en-US");
      if (p < 1) requestAnimationFrame(tick);
    })(start);
  };

  // service unreachable / blocked → count locally on this device instead.
  // The pill is labeled "(local)" so it's never mistaken for the real count.
  const fallback = () => {
    const n = (parseInt(LS.get("views-local") || "0", 10) || 0) + 1;
    LS.set("views-local", String(n));
    animate(n);
    if (uniqEl) uniqEl.textContent = "(local)";
    console.warn("Counters unreachable (blocked or offline) — showing a local per-device count.");
  };

  // ---- primary: same-origin counter worker (immune to ad-blockers) ----
  // Requires the Cloudflare Worker in biolink-counter/ (see its README).
  // If it's not deployed yet, falls through to busuanzi → local count.
  const tryBusuanzi = () => {
    const cbName = "busuanziCallback";
    window[cbName] = data => {                      // JSONP response handler
      cleanup();
      const uv = data && data.page_uv != null ? Number(data.page_uv) : NaN;
      if (!isNaN(uv)) {
        LS.set("views-real", String(uv));           // remember last real value
        animate(uv);
        console.info(`[views] live count from busuanzi: ${uv} unique views`);
      } else fallback();
    };
    const s = document.createElement("script");
    s.src = "https://busuanzi.ibruce.info/busuanzi?jsonpCallback=" + cbName;
    const cleanup = () => { delete window[cbName]; s.remove(); clearTimeout(t); };
    const t = setTimeout(() => { if (window[cbName]) { cleanup(); fallback(); } }, 6000);
    s.onerror = () => { if (window[cbName]) { cleanup(); fallback(); } };
    document.body.appendChild(s);
  };

  fetch("/api/views")
    .then(r => { if (!r.ok) throw new Error("counter endpoint not deployed (" + r.status + ")"); return r.json(); })
    .then(d => {
      if (d && typeof d.unique === "number") {
        LS.set("views-real", String(d.unique));     // remember last real value
        animate(d.unique);
        console.info(`[views] live count from own origin: ${d.unique} unique views`);
      } else throw new Error("bad counter payload");
    })
    .catch(err => { console.warn("[views] own-origin counter unavailable — " + err.message); tryBusuanzi(); });
})();

/* ================================================================
   MUSIC — a soft ambient synth-pad generated with WebAudio,
   so there's nothing to download. Swap for a real song by
   adding <audio id="bgm" src="song.mp3" loop></audio> and
   toggling bgm.play()/bgm.pause() in toggleMusic() instead.
   ================================================================ */
let audioCtx = null, masterGain = null, chordTimer = null, musicOn = false;

const CHORDS = [                       // gentle Am → Fmaj7 → Cmaj7 → G loop
  [110.00, 164.81, 220.00, 261.63, 329.63],          // A minor
  [ 87.31, 130.81, 174.61, 220.00, 329.63],          // Fmaj7
  [130.81, 196.00, 261.63, 329.63, 493.88],          // Cmaj7
  [ 98.00, 146.83, 196.00, 246.94, 293.66],          // G major
];

function startMusic() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.5;
  const filter = audioCtx.createBiquadFilter();       // soften the tone
  filter.type = "lowpass";
  filter.frequency.value = 950;
  masterGain.connect(filter).connect(audioCtx.destination);

  const CHORD_SECS = 8, OVERLAP = 3;
  const playChord = (freqs, t0) => {
    freqs.forEach(f => {
      [[1, 0], [1.003, 0.4]].forEach(([detune, pan]) => {   // detuned pair = warmth
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const panner = audioCtx.createStereoPanner();
        osc.type = "sine";
        osc.frequency.value = f;
        osc.detune.value = (detune - 1) * 100;
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(0.045, t0 + 2.2);   // slow attack
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + CHORD_SECS + OVERLAP);
        panner.pan.value = pan;
        osc.connect(gain).connect(panner).connect(filter);
        osc.start(t0);
        osc.stop(t0 + CHORD_SECS + OVERLAP + 0.2);
      });
    });
  };

  let i = 0;
  chordTimer = setInterval(() => {
    playChord(CHORDS[i % CHORDS.length], audioCtx.currentTime + 0.05);
    i++;
  }, CHORD_SECS * 1000);
  playChord(CHORDS[0], audioCtx.currentTime + 0.05);   // first chord right away
}

function stopMusic() {
  clearInterval(chordTimer);
  chordTimer = null;
  masterGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.4);  // fade out
  setTimeout(() => { audioCtx.close(); audioCtx = null; }, 1200);
}

document.getElementById("musicBtn").addEventListener("click", function () {
  musicOn = !musicOn;
  this.setAttribute("aria-pressed", String(musicOn));
  document.getElementById("iconMuted").style.display = musicOn ? "none" : "";
  document.getElementById("iconOn").style.display    = musicOn ? "" : "none";
  if (musicOn) startMusic(); else stopMusic();
});

/* ================================================================
   LIVE DISCORD PRESENCE — powered by Lanyard (lanyard.rest),
   the same service guns.lol-style sites use. Real-time status,
   game / custom status / Spotify now-playing on your badge.

   HOW TO ACTIVATE:
   1. Join Lanyard's Discord server with YOUR account:
      https://discord.gg/lanyard   (required once — authorizes tracking)
   2. Confirm PRESENCE.id below is your Discord user ID.
   3. Done — status updates in real time. No token, no self-hosting.

   If Lanyard has no data (not monitored yet / API down), the badge
   falls back to CONFIG.presence above.

   NOTE: Lanyard's socket only pushes presence CHANGES (verified live),
   so the initial state comes from one REST fetch on page load, and the
   socket keeps the badge instantly in sync from then on.
   ================================================================ */
const PRESENCE = {
  id: "735574309162188822",        // ← your Discord user ID
  fallback: CONFIG.presence,       // shown when Lanyard has no live data
  wsUrl: "wss://api.lanyard.rest/socket",
  restUrl: "https://api.lanyard.rest/v1/users/",
};

/* status → dot color (Discord's palette) */
const STATUS_COLORS = { online: "#3ddc84", idle: "#faa61a", dnd: "#ed4245", offline: "#80848e" };
/* activity type → verb (Discord activity types) */
const ACTIVITY_VERBS = { 0: "playing", 1: "streaming", 2: "listening to", 3: "watching", 5: "competing" };

const dotEl = document.querySelector(".status-dot");
const pillText = document.getElementById("presenceText");
const actList = document.getElementById("activityList");
const avatarImg = document.getElementById("avatarImg");
const statusLine = document.getElementById("statusLine");

/* small stroke icons for activity rows (game / stream / listen / watch / custom / compete) */
const ACTIVITY_ICONS = {
  0: '<rect x="2.5" y="7.5" width="19" height="9" rx="4.5"/><circle cx="6.5" cy="12" r="1.1" fill="currentColor" stroke="none"/><circle cx="9.7" cy="12" r="1.1" fill="currentColor" stroke="none"/><path d="M15 10.5h4M17 8.5v4"/>',
  1: '<circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z" fill="currentColor" stroke="none"/>',
  2: '<path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/>',
  3: '<rect x="2.5" y="6" width="19" height="13" rx="2.5"/><path d="M8.5 2.5 12 6l3.5-3.5"/>',
  4: '<path d="M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z"/>',
  5: '<path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 5H4v2a3 3 0 0 0 3 3M17 5h3v2a3 3 0 0 1-3 3M12 14v4M8.5 21h7"/>',
};

/* Resolve Discord activity artwork into real image URLs:
   - "mp:external/<hash>/https/<domain>/<path>" embeds the real (proxied) URL
   - a plain asset key resolves via Discord's app-assets CDN
   Returns { large, small, largeText, smallText } or null when unusable. */
function resolveActivityArt(act) {
  const a = act.assets;
  if (!a) return null;
  const resolve = key => {
    if (!key) return null;
    if (key.startsWith("mp:external/")) {            // decode the embedded URL
      const p = key.split("/");
      if (p.length < 4) return null;
      return `${p[2]}://${p.slice(3).join("/")}`;
    }
    if (key.startsWith("spotify:")) return null;      // spotify handled separately
    if (act.application_id) return `https://cdn.discordapp.com/app-assets/${act.application_id}/${key}.png`;
    return null;
  };
  const large = resolve(a.large_image);
  if (!large) return null;
  return { large, small: resolve(a.small_image),
           largeText: a.large_text || "", smallText: a.small_text || "" };
}

/* Format "for 12m" / "for 2h 5m" from an activity's start timestamp */
function fmtElapsed(startMs) {
  if (!startMs) return "";
  const mins = Math.floor((Date.now() - startMs) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return `for ${mins}m`;
  const h = Math.floor(mins / 60), m = mins % 60;
  return m ? `for ${h}h ${m}m` : `for ${h}h`;
}

/* Escape user-supplied text (custom status) before injecting it as HTML */
const escapeHtml = s => String(s).replace(/[&<>"']/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* Keep the profile picture in sync with Discord. Lanyard reports the
   CURRENT avatar hash, so changing your avatar in Discord updates the
   site within seconds (animated avatars load as .gif automatically). */
function syncAvatar(data) {
  const u = data.discord_user;
  if (!u || !u.avatar) return;                        // no profile data yet → keep current image
  const ext = u.avatar.startsWith("a_") ? "gif" : "png";
  const src = `https://cdn.discordapp.com/avatars/${u.id}/${u.avatar}.${ext}?size=256`;
  if (avatarImg.getAttribute("src") !== src) {
    avatarImg.src = src;
    avatarImg.style.display = "";                    // unhide if a stale URL had hidden it
  }
}

/* Discord-style status line: your custom status ("what's on your mind")
   with its emoji — updates live whenever you change it in Discord. */
function syncStatusLine(data) {
  const custom = (data.activities || []).find(a => a.type === 4 && (a.state || (a.emoji && a.emoji.name)));
  if (!custom) { statusLine.hidden = true; statusLine.textContent = ""; return; }
  const emo = custom.emoji || {};
  let emojiHtml = "";
  if (emo.name) {
    emojiHtml = emo.id
      ? `<img class="emoji" alt="" src="https://cdn.discordapp.com/emojis/${emo.id}.${emo.animated ? "gif" : "png"}">`
      : `<span aria-hidden="true">${emo.name}</span> `;   // plain unicode emoji
  }
  statusLine.innerHTML = emojiHtml + escapeHtml(custom.state || "");
  statusLine.hidden = false;
}

/* Build the activity panel: Spotify → games/streams/etc.
   (custom status lives in the status line above, Discord-style)
   Badge (dot + status word) is handled separately in renderPresence. */
function renderActivities(data) {
  actList.innerHTML = "";
  const acts = data.activities || [];
  const rows = [];

  // 1) Spotify now-playing (album art + song — artist)
  if (data.listening_to_spotify && data.spotify) {
    rows.push({ icon: 2, title: data.spotify.song, detail: data.spotify.artist,
                art: data.spotify.album_art_url, alt: "Album art",
                start: data.spotify.timestamps && data.spotify.timestamps.start });
  }

  // 2) everything else: games, watching, streaming, competing (with real artwork)
  acts.filter(a => a.type !== 4 && !(a.type === 2 && data.listening_to_spotify)).forEach(a => {
    const verb = ACTIVITY_VERBS[a.type] || "playing";
    const art = resolveActivityArt(a);
    rows.push({ icon: a.type, title: `${verb} ${a.name}`, detail: a.details || a.state || "",
                art: art && art.large, smallArt: art && art.small,
                artTitle: art && art.largeText, smallTitle: art && art.smallText,
                start: a.timestamps && a.timestamps.start });
  });

  rows.forEach(r => {
    const li = document.createElement("li");
    if (r.art) {
      // Discord-style artwork card (with optional small overlay badge)
      const wrap = document.createElement("span");
      wrap.className = "act-art-wrap";
      const img = document.createElement("img");
      img.className = "act-art";
      img.src = r.art;
      img.alt = r.alt || "Artwork";
      if (r.artTitle) img.title = r.artTitle;
      img.onerror = () => {                        // artwork failed → icon tile
        const tile = document.createElement("span");
        tile.className = "act-icon";
        tile.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ACTIVITY_ICONS[r.icon] || ACTIVITY_ICONS[0]}</svg>`;
        wrap.replaceWith(tile);
      };
      wrap.appendChild(img);
      if (r.smallArt) {
        const small = document.createElement("img");
        small.className = "act-art-small";
        small.src = r.smallArt;
        small.alt = "";
        if (r.smallTitle) small.title = r.smallTitle;
        wrap.appendChild(small);
      }
      li.appendChild(wrap);
    } else {
      const tile = document.createElement("span");
      tile.className = "act-icon";
      tile.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ACTIVITY_ICONS[r.icon] || ACTIVITY_ICONS[0]}</svg>`;
      li.appendChild(tile);
    }
    const body = document.createElement("span");
    body.className = "act-body";
    const title = document.createElement("span");
    title.className = "act-name";
    title.textContent = r.title;
    body.appendChild(title);
    if (r.detail) {
      const detail = document.createElement("span");
      detail.className = "act-detail";
      detail.textContent = r.detail;
      body.appendChild(detail);
    }
    li.appendChild(body);
    const time = fmtElapsed(r.start);
    if (time) {
      const t = document.createElement("span");
      t.className = "act-time";
      t.textContent = time;
      li.appendChild(t);
    }
    actList.appendChild(li);
  });

  actList.hidden = actList.children.length === 0;
}

/* Turn one Lanyard presence payload into badge + dot state.
   Also syncs the avatar and the custom-status line; the activity
   panel below carries games, Spotify, and watching/streaming. */
function renderPresence(data) {
  lastPresence = data;
  const status = data.discord_status || "offline";
  dotEl.style.background = STATUS_COLORS[status] || STATUS_COLORS.offline;
  dotEl.classList.toggle("live-online", status === "online");
  pillText.textContent = status === "dnd" ? "do not disturb" : status;
  syncAvatar(data);
  syncStatusLine(data);
  renderActivities(data);
}

/* Refresh elapsed times ("for 12m") every 30s while presence is live */
let lastPresence = null;
setInterval(() => { if (lastPresence) renderActivities(lastPresence); }, 30000);

/* ---- realtime path: WebSocket to Lanyard ---- */
let ws = null, hbTimer = null, wsTries = 0;

function startWS() {
  if (ws && (ws.readyState === 0 || ws.readyState === 1)) return;   // already connected
  if (typeof WebSocket === "undefined") return;   // REST path covers data anyway
  let sock;
  try { sock = new WebSocket(PRESENCE.wsUrl); } catch { return; }
  ws = sock;
  sock.onopen = () => {
    sock.send(JSON.stringify({ op: 2, d: { subscribe_to_ids: [PRESENCE.id] } }));
    wsTries = 0;
  };
  sock.onmessage = ev => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch { return; }
    if (msg.op === 1) {                       // hello → keep the socket alive
      clearInterval(hbTimer);
      hbTimer = setInterval(() => { try { sock.send(JSON.stringify({ op: 3, d: {} })); } catch {} },
                             (msg.d && msg.d.heartbeat_interval) || 30000);
    } else if (msg.op === 4 && msg.d) {       // live presence delta
      renderPresence(msg.d);
    }
  };
  sock.onclose = () => {
    clearInterval(hbTimer);
    wsTries++;
    setTimeout(startWS, Math.min(2000 * Math.pow(2, wsTries), 30000));  // reconnect w/ backoff
  };
  sock.onerror = () => { try { sock.close(); } catch {} };
}

/* ---- initial state + safety net: REST poll every 30s ---- */
function pollREST() {
  if (typeof fetch !== "function") return;    // very old browser → keep static text
  fetch(PRESENCE.restUrl + PRESENCE.id)
    .then(r => r.json())
    .then(json => {
      if (json.success && json.data) renderPresence(json.data);
      else pillText.textContent = PRESENCE.fallback;   // not monitored (yet)
      setTimeout(pollREST, 30000);
    })
    .catch(() => setTimeout(pollREST, 60000));
}

document.addEventListener("DOMContentLoaded", () => { pollREST(); startWS(); });
</script>
